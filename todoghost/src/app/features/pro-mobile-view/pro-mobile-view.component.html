<div class="pmob-home">

  <!-- Background tint -->
  <div class="pmob-home__bg" aria-hidden="true"></div>

  <!-- Sticky topbar: logo + workspace name + user chip + back button.
       Lives outside the scroll surface so it stays pinned while the rest
       of the page scrolls. -->
  <header class="pmob-topbar">
    <app-svg-icon name="logo_main" width="26px" height="26px" class="pmob-topbar__logo"></app-svg-icon>
    <div class="pmob-topbar__ws">
      <span class="pmob-topbar__wsname">{{ currentWorkspace?.name || 'ToDoghost' }}</span>
      <span class="pmob-topbar__user" *ngIf="currentUser">
        <span class="pmob-topbar__avatar">{{ (currentUser.name || '?')[0] }}</span>
        {{ currentUser.name }}
      </span>
    </div>
    <button class="pmob-topbar__exit" (click)="backToWorkspaces()" title="返回選擇空間" aria-label="返回選擇空間">
      <span class="material-icons" style="font-size: 20px;">logout</span>
    </button>
  </header>

  <!-- ============ Scrollable content ============ -->
  <main class="pmob-home__scroll ios-scroll">

    <!-- Headline: date + lunar (back button moved up to the topbar) -->
    <header class="pmob-home__head">
      <div class="pmob-home__date">
        <div class="pmob-home__date-main">{{ selectedDateStr() }}</div>
        <div class="pmob-home__date-sub">
          <span>{{ headlineDayName }}</span>
          <span *ngIf="headlineLunar.label"
                class="pmob-home__lunar"
                [class.is-solar-term]="headlineLunar.isSolarTerm">
            · {{ headlineLunar.label }}
          </span>
          <span *ngIf="isHeadlineToday" class="pmob-home__today-chip">今天</span>
        </div>
      </div>
    </header>

    <!-- Calendar block: nav row + week strip OR month grid -->
    <section class="pmob-cal">
      <header class="pmob-cal__nav">
        <button class="pmob-cal__arrow" (click)="prevPeriod()" aria-label="上一個">
          <span class="material-icons" style="font-size: 20px;">chevron_left</span>
        </button>
        <button class="pmob-cal__title" (click)="resetToToday()">{{ periodTitle() }}</button>
        <button class="pmob-cal__arrow" (click)="nextPeriod()" aria-label="下一個">
          <span class="material-icons" style="font-size: 20px;">chevron_right</span>
        </button>
        <button class="pmob-cal__toggle"
                (click)="toggleCalExpanded()"
                [title]="calExpanded() ? '收起為週' : '展開為月'">
          <span class="material-icons" style="font-size: 20px;">
            {{ calExpanded() ? 'unfold_less' : 'unfold_more' }}
          </span>
        </button>
      </header>

      <!-- Week strip view (default) -->
      <div *ngIf="!calExpanded()" class="pmob-week-strip">
        <button *ngFor="let d of weekStrip()"
                class="pmob-week-strip__day"
                [class.is-today]="d.isToday"
                [class.is-selected]="d.isSelected"
                (click)="selectCalendarDay(d.dateStr)">
          <span class="pmob-week-strip__name">{{ d.dayName }}</span>
          <span class="pmob-week-strip__num">{{ d.dayNum }}</span>
          <span class="pmob-week-strip__dot"
                [class.is-urgent]="d.hasUrgent"
                [class.is-empty]="!d.hasTasks"></span>
        </button>
      </div>

      <!-- Full month grid (expanded) -->
      <div *ngIf="calExpanded()" class="pmob-month-grid">
        <div class="pmob-month-grid__weekheader">
          <span *ngFor="let day of ['一','二','三','四','五','六','日']">{{ day }}</span>
        </div>
        <div class="pmob-month-grid__cells">
          <button *ngFor="let d of monthCells()"
                  class="pmob-month-grid__day"
                  [class.is-other-month]="!d.isCurrentMonth"
                  [class.is-today]="d.isToday"
                  [class.is-selected]="d.isSelected"
                  (click)="selectCalendarDay(d.dateStr)">
            <span class="pmob-month-grid__num">{{ d.dayNum }}</span>
            <span *ngIf="d.hasTasks" class="pmob-month-grid__dot"
                  [class.is-urgent]="d.hasUrgent"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- Smart list cards (2x2) -->
    <section class="pmob-cards">
      <button class="pmob-card pmob-card--today" (click)="openSmartList('today')">
        <span class="pmob-card__icon">
          <span class="material-icons" style="font-size: 22px;">wb_sunny</span>
        </span>
        <span class="pmob-card__count">{{ smartListCount('today') }}</span>
        <span class="pmob-card__label">今日</span>
      </button>
      <button class="pmob-card pmob-card--week" (click)="openSmartList('week')">
        <span class="pmob-card__icon">
          <span class="material-icons" style="font-size: 22px;">date_range</span>
        </span>
        <span class="pmob-card__count">{{ smartListCount('week') }}</span>
        <span class="pmob-card__label">本週</span>
      </button>
      <button class="pmob-card pmob-card--urgent" (click)="openSmartList('urgent')">
        <span class="pmob-card__icon">
          <span class="material-icons" style="font-size: 22px;">priority_high</span>
        </span>
        <span class="pmob-card__count">{{ smartListCount('urgent') }}</span>
        <span class="pmob-card__label">緊急</span>
      </button>
      <button class="pmob-card pmob-card--unscheduled" (click)="openSmartList('unscheduled')">
        <span class="pmob-card__icon">
          <span class="material-icons" style="font-size: 22px;">event_busy</span>
        </span>
        <span class="pmob-card__count">{{ smartListCount('unscheduled') }}</span>
        <span class="pmob-card__label">未排程</span>
      </button>
    </section>

    <!-- Categories list -->
    <section class="pmob-group">
      <div class="pmob-group__head">
        <h4 class="pmob-group__title">我的分類</h4>
        <button class="pmob-group__add" (click)="openCategoryCreate()" aria-label="新增分類">
          <span class="material-icons" style="font-size: 18px;">add</span>
        </button>
      </div>
      <div class="pmob-group__card">
        <button *ngFor="let c of categories" class="pmob-grouprow" (click)="openCategoryList(c)">
          <span class="pmob-grouprow__icon" style="background: linear-gradient(135deg, #d6cab7, #b5a78a);">
            <ng-container *ngIf="c.icon && !isEmoji(c.icon)">
              <span class="material-icons" style="font-size: 14px;">{{ c.icon }}</span>
            </ng-container>
            <span *ngIf="c.icon && isEmoji(c.icon)" style="font-size: 14px;">{{ c.icon }}</span>
          </span>
          <span class="pmob-grouprow__label">{{ c.name }}</span>
          <span class="pmob-grouprow__count">{{ categoryCount(c.id) }}</span>
          <span class="material-icons pmob-grouprow__chev">chevron_right</span>
        </button>
        <button class="pmob-grouprow" *ngIf="noCategoryCount() > 0" (click)="openNoCategoryList()">
          <span class="pmob-grouprow__icon" style="background: linear-gradient(135deg, #e5e5e5, #a3a3a3); color: #fff;">
            <span class="material-icons" style="font-size: 14px;">block</span>
          </span>
          <span class="pmob-grouprow__label">無分類</span>
          <span class="pmob-grouprow__count">{{ noCategoryCount() }}</span>
          <span class="material-icons pmob-grouprow__chev">chevron_right</span>
        </button>
        <button class="pmob-grouprow" (click)="openSmartList('inbox')">
          <span class="pmob-grouprow__icon" style="background: linear-gradient(135deg, #94a3b8, #64748b);">
            <span class="material-icons" style="font-size: 14px;">inbox</span>
          </span>
          <span class="pmob-grouprow__label">所有代辦</span>
          <span class="pmob-grouprow__count">{{ smartListCount('inbox') }}</span>
          <span class="material-icons pmob-grouprow__chev">chevron_right</span>
        </button>
        <button class="pmob-grouprow" (click)="openSmartList('completed')">
          <span class="pmob-grouprow__icon" style="background: linear-gradient(135deg, #86efac, #22c55e);">
            <span class="material-icons" style="font-size: 14px;">done_all</span>
          </span>
          <span class="pmob-grouprow__label">已完成</span>
          <span class="pmob-grouprow__count">{{ smartListCount('completed') }}</span>
          <span class="material-icons pmob-grouprow__chev">chevron_right</span>
        </button>
      </div>
    </section>

    <!-- Collaborators -->
    <section class="pmob-group" *ngIf="workspaceUsers.length > 1">
      <h4 class="pmob-group__title">建立者</h4>
      <div class="pmob-group__chips">
        <button *ngFor="let u of workspaceUsers" class="pmob-userchip"
                [style.background]="userColor(u.id)?.avatar"
                [style.color]="userColor(u.id)?.text"
                (click)="openUserList(u)">
          <span class="pmob-userchip__avatar" [style.background]="userColor(u.id)?.bar">
            {{ userInitial(u.id) }}
          </span>
          <span>{{ u.name }}</span>
          <span class="pmob-userchip__count">{{ userCount(u.id) }}</span>
        </button>
      </div>
    </section>

    <!-- Spacer so quick-add bar doesn't overlap last row -->
    <div class="pmob-home__spacer"></div>
  </main>

  <!-- ============ Docked quick add ============ -->
  <div class="pmob-quickadd">
    <span class="material-icons pmob-quickadd__icon">edit_note</span>
    <input class="pmob-quickadd__input"
           [ngModel]="quickAddTitle()"
           (ngModelChange)="quickAddTitle.set($event)"
           (keydown.enter)="submitQuickAdd()"
           placeholder="新增代辦…"
           inputmode="text">
    <button class="pmob-quickadd__btn"
            [class.is-ready]="quickAddTitle().trim().length > 0"
            (click)="onQuickAddButton()"
            [title]="quickAddTitle().trim() ? '送出' : '新增代辦'">
      <span class="material-icons" style="font-size: 20px;">{{ quickAddTitle().trim() ? 'arrow_upward' : 'add' }}</span>
    </button>
  </div>

  <!-- ============ Inline new-category dialog ============ -->
  <div *ngIf="showCategoryCreate()" class="pmob-catnew-scrim" (click)="closeCategoryCreate()">
    <div class="pmob-catnew" (click)="$event.stopPropagation()">
      <div class="pmob-catnew__head">
        <h3>新增分類</h3>
      </div>
      <input class="pmob-catnew__name"
             [ngModel]="newCategoryName()"
             (ngModelChange)="newCategoryName.set($event)"
             (keydown.enter)="submitCategoryCreate()"
             placeholder="分類名稱"
             autofocus>
      <div class="pmob-catnew__icons">
        <button *ngFor="let ic of availableCategoryIcons"
                class="pmob-catnew__icon"
                [class.is-active]="newCategoryIcon() === ic"
                (click)="newCategoryIcon.set(ic)">
          <span class="material-icons" style="font-size: 18px;">{{ ic }}</span>
        </button>
      </div>
      <div class="pmob-catnew__actions">
        <button class="pmob-catnew__btn pmob-catnew__btn--cancel" (click)="closeCategoryCreate()">取消</button>
        <button class="pmob-catnew__btn pmob-catnew__btn--save"
                [disabled]="!newCategoryName().trim()"
                (click)="submitCategoryCreate()">建立</button>
      </div>
    </div>
  </div>
</div>
