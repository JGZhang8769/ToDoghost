<div class="pmm-shell">
  <div class="pmm-bg" aria-hidden="true"></div>

  <!-- Nav bar -->
  <header class="pmm-nav">
    <button class="pmm-back" (click)="back()">
      <span class="material-icons" style="font-size: 22px;">chevron_left</span>
      <span>返回</span>
    </button>
    <div class="pmm-nav__center">
      <button class="pmm-arrow" (click)="prevPeriod()" aria-label="上一個">
        <span class="material-icons" style="font-size: 18px;">chevron_left</span>
      </button>
      <button class="pmm-nav__title" (click)="goToToday()">{{ currentTitle() }}</button>
      <button class="pmm-arrow" (click)="nextPeriod()" aria-label="下一個">
        <span class="material-icons" style="font-size: 18px;">chevron_right</span>
      </button>
    </div>
    <button class="pmm-iconbtn" (click)="openCreate()" aria-label="新增">
      <span class="material-icons" style="font-size: 22px;">add</span>
    </button>
  </header>

  <!-- Grain switcher -->
  <div class="pmm-grain">
    <button class="pmm-grain__btn" [class.is-active]="grain() === 'month'" (click)="setGrain('month')">月</button>
    <button class="pmm-grain__btn" [class.is-active]="grain() === 'week'" (click)="setGrain('week')">週</button>
  </div>

  <!-- ============ Month grain ============ -->
  <ng-container *ngIf="grain() === 'month'">
    <section class="pmm-month">
      <div class="pmm-month__weekheader">
        <span *ngFor="let day of ['一','二','三','四','五','六','日']">{{ day }}</span>
      </div>
      <div class="pmm-month__grid">
        <button *ngFor="let d of monthCells()"
                class="pmm-day"
                [class.is-other-month]="!d.isCurrentMonth"
                [class.is-today]="d.isToday"
                [class.is-selected]="d.isSelected"
                (click)="selectCell(d.dateStr)">
          <span class="pmm-day__num">{{ d.dayNum }}</span>
          <span *ngIf="d.lunarLabel" class="pmm-day__lunar"
                [class.is-solar-term]="d.isSolarTerm">{{ d.lunarLabel }}</span>
          <span *ngIf="d.hasTasks" class="pmm-day__dot"
                [class.is-urgent]="d.hasUrgent"></span>
        </button>
      </div>
    </section>

    <!-- Selected day list -->
    <section class="pmm-daylist">
      <header class="pmm-daylist__head">
        <span class="pmm-daylist__date">{{ selectedDateStr() }}</span>
        <button class="pmm-daylist__more" (click)="openDayList()">
          查看詳細
          <span class="material-icons" style="font-size: 16px;">chevron_right</span>
        </button>
      </header>
      <div class="pmm-daylist__body ios-scroll">
        <div *ngIf="selectedDayTasks.length === 0" class="pmm-daylist__empty">
          這天沒有代辦
        </div>
        <button *ngFor="let t of selectedDayTasks"
                class="pmm-daylist__row"
                [class.is-urgent]="t.isUrgent && t.status !== 'completed'"
                [class.is-done]="t.status === 'completed'"
                (click)="openTask(t)">
          <span *ngIf="t.startTime" class="pmm-daylist__time tabular-nums">{{ t.startTime }}</span>
          <span *ngIf="!t.startTime" class="pmm-daylist__time pmm-daylist__time--none">全天</span>
          <span class="pmm-daylist__title">
            <ng-container *ngIf="categoryFor(t.categoryId) as cat">
              <span *ngIf="cat.icon && !isEmoji(cat.icon)" class="material-icons" style="font-size: 13px; opacity: 0.6;">{{ cat.icon }}</span>
              <span *ngIf="cat.icon && isEmoji(cat.icon)" style="font-size: 13px;">{{ cat.icon }}</span>
            </ng-container>
            {{ t.title }}
            <span *ngIf="t.isUrgent" class="material-icons" style="font-size: 12px; color: #ef4444;">priority_high</span>
          </span>
          <span class="material-icons pmm-daylist__chev">chevron_right</span>
        </button>
      </div>
    </section>
  </ng-container>

  <!-- ============ Week grain (24h timeline) ============ -->
  <ng-container *ngIf="grain() === 'week'">
    <section class="pmm-week">
      <!-- Day header row -->
      <div class="pmm-week__header">
        <div class="pmm-week__gutter"></div>
        <button *ngFor="let c of weekCols()"
                class="pmm-week__day"
                [class.is-today]="c.isToday"
                [class.is-selected]="c.isSelected"
                (click)="selectCell(c.dateStr)">
          <span class="pmm-week__dayname">{{ c.dayName }}</span>
          <span class="pmm-week__daynum">{{ c.dayNum }}</span>
        </button>
      </div>

      <!-- All-day row -->
      <div class="pmm-week__allday">
        <div class="pmm-week__gutter pmm-week__gutter--allday">全天</div>
        <div *ngFor="let c of weekCols()" class="pmm-week__allday-cell" (click)="selectCell(c.dateStr)">
          <div *ngFor="let t of c.allDay"
               class="pmm-week__chip"
               [class.is-urgent]="t.isUrgent && t.status !== 'completed'"
               [class.is-done]="t.status === 'completed'"
               (click)="openTask(t); $event.stopPropagation()">
            {{ t.title }}
          </div>
        </div>
      </div>

      <!-- Scrollable hour grid -->
      <div class="pmm-week__scroll ios-scroll">
        <div class="pmm-week__grid">
          <div class="pmm-week__hours">
            <div *ngFor="let h of dayHours" class="pmm-week__hour-label" [style.height.px]="hourPx">
              {{ h }}:00
            </div>
          </div>
          <div *ngFor="let c of weekCols()" class="pmm-week__col"
               [class.is-today]="c.isToday"
               [class.is-selected]="c.isSelected"
               (click)="selectCell(c.dateStr)">
            <div *ngFor="let h of dayHours" class="pmm-week__hour-cell" [style.height.px]="hourPx"></div>
            <div *ngFor="let block of c.timed"
                 class="pmm-week__event"
                 [class.is-urgent]="block.task.isUrgent && block.task.status !== 'completed'"
                 [class.is-done]="block.task.status === 'completed'"
                 [style.top.px]="block.top"
                 [style.height.px]="block.height"
                 [style.left]="(block.col * (100 / block.totalCols)) + '%'"
                 [style.width]="'calc(' + (100 / block.totalCols) + '% - 2px)'"
                 (click)="openTask(block.task); $event.stopPropagation()">
              <div class="pmm-week__event-title">{{ block.task.title }}</div>
              <div class="pmm-week__event-time tabular-nums" *ngIf="block.task.startTime">
                {{ block.task.startTime }}<span *ngIf="block.task.endTime"> - {{ block.task.endTime }}</span>
              </div>
            </div>
            <!-- Now line on today's column -->
            <div *ngIf="c.isToday" class="pmm-week__now" [style.top.px]="nowLineTop()"></div>
          </div>
        </div>
      </div>
    </section>
  </ng-container>
</div>
